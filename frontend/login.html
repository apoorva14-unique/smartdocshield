<!DOCTYPE html>
<html>
<head>
    <title>Login - SmartDocShield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="glass-card" style="max-width:400px;margin:auto;">
        <h2>🔐 Login</h2>

        <input type="text" id="username" placeholder="Username" class="input-box">
        <input type="password" id="password" placeholder="Password" class="input-box">

        <button onclick="login()" class="glow-button">Login</button>

        <p id="loginMsg"></p>
    </div>
</div>

<script>
async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const res = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
    });

    const data = await res.json();

    if (data.status === "success") {
        localStorage.setItem("loggedIn", "true");
        window.location.href = "index.html";
    } else {
        document.getElementById("loginMsg").innerText = data.message;
    }
}
</script>

</body>
</html>
